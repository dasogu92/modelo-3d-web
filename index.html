<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor GLB</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    #info {
      position: absolute;
      left: 12px;
      bottom: 12px;
      color: white;
      background: rgba(0, 0, 0, 0.55);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div id="info">Cargando modelo...</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
  35,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1;

document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;

const ambientLight = new THREE.AmbientLight(0xffffff, 1.8);
scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
keyLight.position.set(3, 5, 4);
scene.add(keyLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 1.2);
fillLight.position.set(-4, 2, -3);
scene.add(fillLight);

const backLight = new THREE.DirectionalLight(0xffffff, 1);
backLight.position.set(0, 4, -5);
scene.add(backLight);

let model = null;

const loader = new GLTFLoader();

loader.load(
  "./CAMISETA.glb",
  function (gltf) {
    model = gltf.scene;
    scene.add(model);

    model.traverse((child) => {
      if (child.isMesh) {
        child.frustumCulled = false;

        if (child.material) {
          child.material.side = THREE.DoubleSide;
          child.material.needsUpdate = true;
        }
      }
    });

    fitModelToView(model);

    document.getElementById("info").textContent =
      "Modelo cargado. Arrastra para rotar, rueda para zoom.";
  },
  function (xhr) {
    if (xhr.total) {
      const percent = Math.round((xhr.loaded / xhr.total) * 100);
      document.getElementById("info").textContent = `Cargando modelo... ${percent}%`;
    }
  },
  function (error) {
    console.error(error);
    document.getElementById("info").textContent =
      "Error cargando CAMISETA.glb. Revisa que esté junto al HTML.";
  }
);

function fitModelToView(object) {
  const box = new THREE.Box3().setFromObject(object);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  object.position.x -= center.x;
  object.position.y -= center.y;
  object.position.z -= center.z;

  const maxSize = Math.max(size.x, size.y, size.z);
  const distance = maxSize * 2.2;

  camera.position.set(0, maxSize * 0.2, distance);
  camera.near = maxSize / 100;
  camera.far = maxSize * 100;
  camera.updateProjectionMatrix();

  controls.target.set(0, 0, 0);
  controls.update();
}

function animate() {
  requestAnimationFrame(animate);

  controls.update();
  renderer.render(scene, camera);
}

animate();

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
