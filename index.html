<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camiseta 3D con brisa suave</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,.95);
      padding: 16px;
      border-radius: 10px;
      width: 290px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }

    .panel label {
      font-weight: bold;
      font-size: 13px;
      margin-top: 10px;
      display: block;
    }

    .panel input,
    .panel button {
      width: 100%;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .panel button {
      padding: 8px;
      background: #333;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .panel button:hover {
      background: #555;
    }

    #togglePanel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 20;
      background: #333;
      color: white;
      border: 0;
      padding: 7px 10px;
      border-radius: 6px;
      display: none;
      cursor: pointer;
    }

    #info {
      position: absolute;
      bottom: 12px;
      left: 12px;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 5;
    }
  </style>
</head>

<body>

<div class="panel" id="controlPanel">
  <label>Cargar textura de diseño</label>
  <input type="file" id="inputTextura" accept="image/*" />
  <button id="btnAplicar">🎨 Aplicar textura</button>

  <label>Luz: <span id="luzValue">1.50</span></label>
  <input type="range" id="luzSlider" min="0" max="5" step="0.01" value="1.5" />

  <label>Brisa / viento: <span id="windValue">0.006</span></label>
  <input type="range" id="windSlider" min="0" max="0.03" step="0.001" value="0.006" />

  <label>Velocidad brisa: <span id="speedValue">0.75</span></label>
  <input type="range" id="speedSlider" min="0.1" max="3" step="0.05" value="0.75" />

  <label>Suavidad tela: <span id="softValue">0.018</span></label>
  <input type="range" id="softSlider" min="0.005" max="0.08" step="0.001" value="0.018" />

  <label>Toque ratón: <span id="touchValue">0.012</span></label>
  <input type="range" id="touchSlider" min="0" max="0.05" step="0.001" value="0.012" />

  <label>Radio toque: <span id="radioValue">0.35</span></label>
  <input type="range" id="radioSlider" min="0.05" max="0.8" step="0.01" value="0.35" />

  <button id="btnBrisa">🌬️ Brisa activada</button>
  <button id="btnExportar">📸 Exportar imagen</button>
  <button id="btnMinimizar">🔽 Ocultar panel</button>
</div>

<button id="togglePanel">🔼 Mostrar panel</button>

<div id="info">Cargando modelo...</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

let initialCameraPosition = new THREE.Vector3();
let initialTarget = new THREE.Vector3();

const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

const light1 = new THREE.DirectionalLight(0xffffff, 2);
light1.position.set(4, 5, 5);
scene.add(light1);

const light2 = new THREE.DirectionalLight(0xffffff, 1);
light2.position.set(-4, 2, -4);
scene.add(light2);

let meshes = [];
let model = null;
let texturaCargada = null;
let isPointerDown = false;

let windStrength = 0.006;
let windSpeed = 0.75;
let softness = 0.018;
let touchStrength = 0.012;
let touchRadius = 0.35;
let breezeEnabled = true;

const clock = new THREE.Clock();
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

new GLTFLoader().load(
  "./CAMISETA.glb",
  (gltf) => {
    model = gltf.scene;
    scene.add(model);

    model.traverse((child) => {
      if (child.isMesh && child.geometry && child.geometry.attributes.position) {
        child.geometry = child.geometry.clone();
        child.geometry.computeVertexNormals();

        const pos = child.geometry.attributes.position;

        child.userData.originalPositions = pos.array.slice();
        child.userData.velocities = new Float32Array(pos.array.length);

        meshes.push(child);
      }
    });

    centerModel(model);

    document.getElementById("info").textContent =
      "Brisa suave activa. Arrastra sobre la camiseta para tocar la tela. Doble click reinicia la vista.";
  },
  undefined,
  (error) => {
    console.error(error);
    document.getElementById("info").textContent =
      "Error cargando CAMISETA.glb. Revisa nombre y ubicación.";
  }
);

function centerModel(object) {
  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  object.position.sub(center);

  const maxDim = Math.max(size.x, size.y, size.z);

  camera.position.set(0, maxDim * 0.35, maxDim * 2.8);
  controls.target.set(0, 0, 0);
  controls.update();

  initialCameraPosition.copy(camera.position);
  initialTarget.copy(controls.target);
}

window.addEventListener("pointerdown", () => {
  isPointerDown = true;
});

window.addEventListener("pointerup", () => {
  isPointerDown = false;
});

window.addEventListener("pointerleave", () => {
  isPointerDown = false;
});

window.addEventListener("dblclick", () => {
  camera.position.copy(initialCameraPosition);
  controls.target.copy(initialTarget);
  controls.update();
});

window.addEventListener("pointermove", (event) => {
  if (!isPointerDown || meshes.length === 0) return;

  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects(meshes, true);

  if (hits.length > 0) {
    deformMesh(hits[0].object, hits[0].point);
  }
});

function deformMesh(mesh, worldPoint) {
  const pos = mesh.geometry.attributes.position;
  const localPoint = mesh.worldToLocal(worldPoint.clone());
  const velocities = mesh.userData.velocities;

  for (let i = 0; i < pos.count; i++) {
    const ix = i * 3;

    const dx = pos.array[ix] - localPoint.x;
    const dy = pos.array[ix + 1] - localPoint.y;
    const dz = pos.array[ix + 2] - localPoint.z;

    const dist = Math.sqrt(dx * dx + dy * dy + dz * dz);

    if (dist < touchRadius) {
      const falloff = Math.pow(1 - dist / touchRadius, 2);
      velocities[ix + 2] -= falloff * touchStrength;
    }
  }
}

function updateCloth() {
  const t = clock.getElapsedTime();

  meshes.forEach((mesh) => {
    const pos = mesh.geometry.attributes.position;
    const original = mesh.userData.originalPositions;
    const velocities = mesh.userData.velocities;

    for (let i = 0; i < pos.count; i++) {
      const ix = i * 3;

      const ox = original[ix];
      const oy = original[ix + 1];
      const oz = original[ix + 2];

      let wind = 0;

      if (breezeEnabled) {
        const wave1 = Math.sin((oy * 2.2) + (t * windSpeed));
        const wave2 = Math.sin((ox * 1.6) + (oy * 1.1) + (t * windSpeed * 0.65));

        const verticalInfluence = THREE.MathUtils.clamp((0.8 - oy) * 0.8, 0.15, 1.0);

        wind = (wave1 * 0.7 + wave2 * 0.3) * windStrength * verticalInfluence;
      }

      const targetX = ox + wind * 0.25;
      const targetY = oy;
      const targetZ = oz + wind;

      velocities[ix] += (targetX - pos.array[ix]) * softness;
      velocities[ix + 1] += (targetY - pos.array[ix + 1]) * softness;
      velocities[ix + 2] += (targetZ - pos.array[ix + 2]) * softness;

      velocities[ix] *= 0.92;
      velocities[ix + 1] *= 0.92;
      velocities[ix + 2] *= 0.92;

      pos.array[ix] += velocities[ix];
      pos.array[ix + 1] += velocities[ix + 1];
      pos.array[ix + 2] += velocities[ix + 2];
    }

    pos.needsUpdate = true;
    mesh.geometry.computeVertexNormals();
  });
}

function animate() {
  requestAnimationFrame(animate);

  controls.update();
  updateCloth();

  renderer.render(scene, camera);
}

animate();

document.getElementById("inputTextura").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    texturaCargada = reader.result;
    alert("✅ Textura cargada. Pulsa 'Aplicar textura'.");
  };

  reader.readAsDataURL(file);
});

document.getElementById("btnAplicar").addEventListener("click", () => {
  if (!texturaCargada) {
    alert("⚠️ Primero selecciona una imagen.");
    return;
  }

  const textureLoader = new THREE.TextureLoader();

  textureLoader.load(texturaCargada, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.flipY = false;

    meshes.forEach((mesh) => {
      if (mesh.material) {
        mesh.material = mesh.material.clone();
        mesh.material.map = texture;
        mesh.material.needsUpdate = true;
      }
    });

    alert("✅ Textura aplicada.");
  });
});

document.getElementById("luzSlider").addEventListener("input", (e) => {
  const value = parseFloat(e.target.value);

  ambientLight.intensity = value;
  light1.intensity = value + 0.5;
  light2.intensity = value * 0.7;

  document.getElementById("luzValue").textContent = value.toFixed(2);
});

document.getElementById("windSlider").addEventListener("input", (e) => {
  windStrength = parseFloat(e.target.value);
  document.getElementById("windValue").textContent = windStrength.toFixed(3);
});

document.getElementById("speedSlider").addEventListener("input", (e) => {
  windSpeed = parseFloat(e.target.value);
  document.getElementById("speedValue").textContent = windSpeed.toFixed(2);
});

document.getElementById("softSlider").addEventListener("input", (e) => {
  softness = parseFloat(e.target.value);
  document.getElementById("softValue").textContent = softness.toFixed(3);
});

document.getElementById("touchSlider").addEventListener("input", (e) => {
  touchStrength = parseFloat(e.target.value);
  document.getElementById("touchValue").textContent = touchStrength.toFixed(3);
});

document.getElementById("radioSlider").addEventListener("input", (e) => {
  touchRadius = parseFloat(e.target.value);
  document.getElementById("radioValue").textContent = touchRadius.toFixed(2);
});

document.getElementById("btnBrisa").addEventListener("click", () => {
  breezeEnabled = !breezeEnabled;

  document.getElementById("btnBrisa").textContent = breezeEnabled
    ? "🌬️ Brisa activada"
    : "🌬️ Brisa desactivada";
});

document.getElementById("btnExportar").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "modelo_3d.png";
  link.href = renderer.domElement.toDataURL("image/png");
  link.click();
});

const controlPanel = document.getElementById("controlPanel");
const toggleBtn = document.getElementById("togglePanel");

document.getElementById("btnMinimizar").addEventListener("click", () => {
  controlPanel.style.display = "none";
  toggleBtn.style.display = "block";
});

toggleBtn.addEventListener("click", () => {
  controlPanel.style.display = "block";
  toggleBtn.style.display = "none";
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
