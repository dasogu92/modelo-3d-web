<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visor 3D Camiseta</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/"
    }
  }
  </script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    canvas {
      display: block;
    }

    .panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: rgba(255,255,255,.95);
      padding: 16px;
      border-radius: 10px;
      width: 290px;
      box-shadow: 0 2px 10px rgba(0,0,0,.25);
    }

    .panel label {
      font-weight: bold;
      font-size: 13px;
      margin-top: 10px;
      display: block;
    }

    .panel input,
    .panel button {
      width: 100%;
      margin-top: 8px;
      margin-bottom: 10px;
    }

    .panel button {
      padding: 8px;
      background: #333;
      color: white;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
    }

    .panel button:hover {
      background: #555;
    }

    #togglePanel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 20;
      background: #333;
      color: white;
      border: 0;
      padding: 7px 10px;
      border-radius: 6px;
      display: none;
      cursor: pointer;
    }

    #info {
      position: absolute;
      bottom: 12px;
      left: 12px;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      z-index: 5;
    }
  </style>
</head>

<body>

<div class="panel" id="controlPanel">
  <label>Cargar textura de diseño</label>
  <input type="file" id="inputTextura" accept="image/*" />
  <button id="btnAplicar">🎨 Aplicar textura</button>

  <label>Luz: <span id="luzValue">1.50</span></label>
  <input type="range" id="luzSlider" min="0" max="5" step="0.01" value="1.5" />

  <button id="btnExportar">📸 Exportar imagen</button>
  <button id="btnMinimizar">🔽 Ocultar panel</button>
</div>

<button id="togglePanel">🔼 Mostrar panel</button>

<div id="info">Cargando modelo...</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.01,
  1000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  preserveDrawingBuffer: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;

let initialCameraPosition = new THREE.Vector3();
let initialTarget = new THREE.Vector3();

const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
scene.add(ambientLight);

const light1 = new THREE.DirectionalLight(0xffffff, 2);
light1.position.set(4, 5, 5);
scene.add(light1);

const light2 = new THREE.DirectionalLight(0xffffff, 1);
light2.position.set(-4, 2, -4);
scene.add(light2);

let model = null;
let meshes = [];
let texturaCargada = null;

new GLTFLoader().load(
  "./CAMISETA.glb",
  (gltf) => {
    model = gltf.scene;
    scene.add(model);

    model.traverse((child) => {
      if (child.isMesh) {
        meshes.push(child);

        if (child.geometry) {
          child.geometry.computeVertexNormals();
        }
      }
    });

    centerModel(model);

    document.getElementById("info").textContent =
      "Modelo cargado. Usa el ratón para rotar, hacer zoom o mover la vista. Doble click reinicia la cámara.";
  },
  undefined,
  (error) => {
    console.error(error);
    document.getElementById("info").textContent =
      "Error cargando CAMISETA.glb. Revisa nombre y ubicación.";
  }
);

function centerModel(object) {
  const box = new THREE.Box3().setFromObject(object);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());

  object.position.sub(center);

  const maxDim = Math.max(size.x, size.y, size.z);

  camera.position.set(0, maxDim * 0.35, maxDim * 2.8);
  controls.target.set(0, 0, 0);
  controls.update();

  initialCameraPosition.copy(camera.position);
  initialTarget.copy(controls.target);
}

window.addEventListener("dblclick", () => {
  camera.position.copy(initialCameraPosition);
  controls.target.copy(initialTarget);
  controls.update();
});

function animate() {
  requestAnimationFrame(animate);

  controls.update();
  renderer.render(scene, camera);
}

animate();

document.getElementById("inputTextura").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = () => {
    texturaCargada = reader.result;
    alert("✅ Textura cargada. Pulsa 'Aplicar textura'.");
  };

  reader.readAsDataURL(file);
});

document.getElementById("btnAplicar").addEventListener("click", () => {
  if (!texturaCargada) {
    alert("⚠️ Primero selecciona una imagen.");
    return;
  }

  const textureLoader = new THREE.TextureLoader();

  textureLoader.load(texturaCargada, (texture) => {
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.flipY = false;

    meshes.forEach((mesh) => {
      if (mesh.material) {
        mesh.material = mesh.material.clone();
        mesh.material.map = texture;
        mesh.material.needsUpdate = true;
      }
    });

    alert("✅ Textura aplicada.");
  });
});

document.getElementById("luzSlider").addEventListener("input", (e) => {
  const value = parseFloat(e.target.value);

  ambientLight.intensity = value;
  light1.intensity = value + 0.5;
  light2.intensity = value * 0.7;

  document.getElementById("luzValue").textContent = value.toFixed(2);
});

document.getElementById("btnExportar").addEventListener("click", () => {
  const link = document.createElement("a");
  link.download = "modelo_3d.png";
  link.href = renderer.domElement.toDataURL("image/png");
  link.click();
});

const controlPanel = document.getElementById("controlPanel");
const toggleBtn = document.getElementById("togglePanel");

document.getElementById("btnMinimizar").addEventListener("click", () => {
  controlPanel.style.display = "none";
  toggleBtn.style.display = "block";
});

toggleBtn.addEventListener("click", () => {
  controlPanel.style.display = "block";
  toggleBtn.style.display = "none";
});

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
