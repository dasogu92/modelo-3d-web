  </script>

<body>

<div class="panel">

  <label>Modelo</label>

  <select id="modelSelect">
    <option value="glb">Modelo GLB / 1001</option>
    <option value="legacy">MAILLOT MC CX UNI 1457</option>
  </select>

  <button id="resetBtn">Reset vista</button>

  <div id="info">Cargando...</div>

</div>

<script type="module">

import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const MODELOS = {

  glb: {
    tipo: "glb",
    nombre: "Modelo GLB",
    url: "./modelos/1001/modelo.glb"
  },

  legacy: {
    tipo: "legacy",
    nombre: "MAILLOT MC CX UNI 1457",
    basePath: "./modelos/1457/",
    manifest: "manifest.json"
  }

};

let scene;
let camera;
let renderer;
let controls;
let currentModel = null;

const info = document.getElementById("info");
const modelSelect = document.getElementById("modelSelect");
const resetBtn = document.getElementById("resetBtn");

init();
loadSelectedModel();

modelSelect.addEventListener("change", loadSelectedModel);

resetBtn.addEventListener("click", () => {
  if(currentModel){
    fitToView(currentModel);
  }
});

function init(){

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xe5e5e5);

  camera = new THREE.PerspectiveCamera(
    35,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
  );

  renderer = new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.06;

  const ambient = new THREE.AmbientLight(0xffffff,1.8);
  scene.add(ambient);

  const light1 = new THREE.DirectionalLight(0xffffff,2.2);
  light1.position.set(4,5,5);
  scene.add(light1);

  const light2 = new THREE.DirectionalLight(0xffffff,1.2);
  light2.position.set(-4,3,-3);
  scene.add(light2);

  const light3 = new THREE.DirectionalLight(0xffffff,0.8);
  light3.position.set(0,4,-5);
  scene.add(light3);

  window.addEventListener("resize", onResize);

  animate();
}

async function loadSelectedModel(){

  const key = modelSelect.value;
  const item = MODELOS[key];

  info.textContent = "Cargando " + item.nombre + "...";

  if(currentModel){
    scene.remove(currentModel);
    disposeObject(currentModel);
    currentModel = null;
  }

  try{

    let loaded;

    if(item.tipo === "glb"){
      loaded = await loadGLB(item.url);
    }else{
      loaded = await loadLegacy(item.basePath,item.manifest);
    }

    currentModel = loaded;

    scene.add(currentModel);

    fitToView(currentModel);

    info.textContent = "Modelo cargado correctamente";

  }catch(error){

    console.error(error);

    info.textContent =
      "Error:\n" + error.message;
  }
}

function loadGLB(url){

  return new Promise((resolve,reject)=>{

    const loader = new GLTFLoader();

    loader.load(

      url,

      (gltf)=>{

        const obj = gltf.scene;

        obj.traverse((child)=>{

          if(child.isMesh){

            child.frustumCulled = false;

            if(child.material){

              child.material.side = THREE.DoubleSide;
              child.material.needsUpdate = true;

            }
          }
        });

        resolve(obj);

      },

      undefined,

      reject

    );

  });

}

async function loadLegacy(basePath,manifestFile){

  const manifest = await fetchJSON(basePath + manifestFile);

  const group = new THREE.Group();

  if(!manifest.exterior){
    throw new Error("Manifest sin exterior");
  }

  // ========= EXTERIOR =========

  const extGeoJson = await fetchJSON(
    basePath + manifest.exterior.geometry
  );

  const extGeo = parseLegacyJSON(extGeoJson);

  const extMat = new THREE.MeshPhongMaterial({

    color:0xffffff,
    side:THREE.DoubleSide,
    transparent:false,
    opacity:1,
    shininess:10

  });

  const extMesh = new THREE.Mesh(extGeo,extMat);

  extMesh.name = "EXTERIOR";

  group.add(extMesh);

  // ========= INTERIOR =========

  if(manifest.interior){

    const intGeoJson = await fetchJSON(
      basePath + manifest.interior.geometry
    );

    const intGeo = parseLegacyJSON(intGeoJson);

    const intMat = new THREE.MeshPhongMaterial({

      color:0x777777,
      side:THREE.DoubleSide,
      transparent:false,
      opacity:1,
      shininess:8

    });

    const intMesh = new THREE.Mesh(intGeo,intMat);

    intMesh.name = "INTERIOR";

    group.add(intMesh);

  }

  // ROTACIÓN MODELOS LEGACY

  group.rotation.x = -Math.PI / 2;

  return group;
}

async function fetchJSON(url){

  const response = await fetch(url);

  if(!response.ok){
    throw new Error(
      "No se pudo cargar:\n" + url
    );
  }

  return await response.json();
}

function parseLegacyJSON(json){

  const verts = json.vertices;
  const uvLayer =
    json.uvs && json.uvs[0]
      ? json.uvs[0]
      : [];

  const faces = json.faces;

  const positions = [];
  const uvs = [];
  const normals = [];

  let i = 0;

  while(i < faces.length){

    const type = faces[i++];

    const isQuad = !!(type & 1);
    const hasMaterial = !!(type & 2);
    const hasFaceUv = !!(type & 4);
    const hasFaceVertexUv = !!(type & 8);
    const hasFaceNormal = !!(type & 16);
    const hasFaceVertexNormal = !!(type & 32);
    const hasFaceColor = !!(type & 64);
    const hasFaceVertexColor = !!(type & 128);

    const nv = isQuad ? 4 : 3;

    const vIdx = [];

    for(let k=0;k<nv;k++){
      vIdx.push(faces[i++]);
    }

    if(hasMaterial) i++;
    if(hasFaceUv) i++;

    let uvIdx = null;

    if(hasFaceVertexUv){

      uvIdx = [];

      for(let k=0;k<nv;k++){
        uvIdx.push(faces[i++]);
      }
    }

    if(hasFaceNormal) i++;

    let nIdx = null;

    if(hasFaceVertexNormal){

      nIdx = [];

      for(let k=0;k<nv;k++){
        nIdx.push(faces[i++]);
      }
    }

    if(hasFaceColor) i++;
    if(hasFaceVertexColor) i += nv;

    const triangles = isQuad
      ? [[0,1,2],[0,2,3]]
      : [[0,1,2]];

    for(const tri of triangles){

      for(const k of tri){

        const vi = vIdx[k] * 3;

        positions.push(
          verts[vi],
          verts[vi+1],
          verts[vi+2]
        );

        if(uvIdx && uvLayer.length){

          const ui = uvIdx[k] * 2;

          uvs.push(
            uvLayer[ui],
            uvLayer[ui+1]
          );

        }else{

          uvs.push(0,0);

        }

        if(nIdx && json.normals){

          const ni = nIdx[k] * 3;

          normals.push(
            json.normals[ni],
            json.normals[ni+1],
            json.normals[ni+2]
          );
        }
      }
    }
  }

  const geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.Float32BufferAttribute(
      positions,
      3
    )
  );

  geometry.setAttribute(
    "uv",
    new THREE.Float32BufferAttribute(
      uvs,
      2
    )
  );

  if(normals.length === positions.length){

    geometry.setAttribute(
      "normal",
      new THREE.Float32BufferAttribute(
        normals,
        3
      )
    );

  }else{

    geometry.computeVertexNormals();

  }

  geometry.computeBoundingBox();
  geometry.computeBoundingSphere();

  return geometry;
}

function fitToView(object){

  object.updateMatrixWorld(true);

  const box = new THREE.Box3().setFromObject(object);

  const size =
    box.getSize(new THREE.Vector3());

  const center =
    box.getCenter(new THREE.Vector3());

  object.position.x -= center.x;
  object.position.y -= center.y;
  object.position.z -= center.z;

  const maxSize =
    Math.max(size.x,size.y,size.z);

  const fov =
    camera.fov * Math.PI / 180;

  let distance =
    Math.abs(maxSize / 2 / Math.tan(fov / 2));

  distance *= 1.4;

  camera.position.set(0,0,distance);

  camera.near = distance / 100;
  camera.far = distance * 100;

  camera.updateProjectionMatrix();

  controls.target.set(0,0,0);

  controls.update();
}

function disposeObject(object){

  object.traverse((child)=>{

    if(child.geometry){
      child.geometry.dispose();
    }

    if(child.material){

      const materials =
        Array.isArray(child.material)
          ? child.material
          : [child.material];

      materials.forEach((mat)=>{

        for(const key in mat){

          const value = mat[key];

          if(value && value.isTexture){
            value.dispose();
          }
        }

        mat.dispose();

      });
    }
  });
}

function onResize(){

  camera.aspect =
    window.innerWidth / window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );
}

function animate(){

  requestAnimationFrame(animate);

  controls.update();

  renderer.render(scene,camera);
}

</script>

</body>
</html>
